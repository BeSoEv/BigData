name: cinema-analytics-pipeline

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: cinema-analytics-airflow:2.10.5-spark3.5.4
  user: "50000:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-cinema-webserver-secret
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    PYTHONPATH: /opt/airflow:/opt/airflow/jobs
    PYSPARK_PYTHON: /usr/local/bin/python
    JAVA_HOME: /opt/java
    SPARK_LOCAL_IP: 127.0.0.1
    SPARK_MASTER: local[2]
    SPARK_EXTRA_CLASSPATH: /opt/airflow/s3-jars/*

    TZ: UTC
    S3_ENDPOINT: http://rustfs:9000
    S3_BUCKET: cinema
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-cinema}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-cinema-local-secret}
    AWS_DEFAULT_REGION: us-east-1
    AWS_EC2_METADATA_DISABLED: "true"
    AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 8123
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cinema}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cinema-local-secret}
    CLICKHOUSE_DATABASE: cinema

  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./jobs:/opt/airflow/jobs:ro
    - ./scripts:/opt/airflow/scripts:ro
    - ./data:/opt/airflow/data:ro
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  volume-init:
    image: alpine:3.21
    user: "0:0"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
      - airflow-logs:/airflow-logs
    command:
      - sh
      - -ec
      - "chown -R 10001:10001 /data /logs; chown -R 50000:0 /airflow-logs"
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.4
    user: "10001:10001"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-cinema}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-cinema-local-secret}
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic cinema.events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic cinema.profile_changes --partitions 1 --replication-factor 1
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cinema}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cinema-local-secret}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9002}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./docker/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-cinema}", "--password", "${CLICKHOUSE_PASSWORD:-cinema-local-secret}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-student}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-student}
      _AIRFLOW_WWW_USER_FIRSTNAME: Student
      _AIRFLOW_WWW_USER_LASTNAME: Cinema
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: student@example.com
    command: version
    restart: "no"

  s3-init:
    <<: *airflow-common
    depends_on:
      rustfs:
        condition: service_healthy
    command: ["python", "/opt/airflow/scripts/init_s3.py"]
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  archive-consumer:
    <<: *airflow-common
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    command: ["python", "/opt/airflow/scripts/archive_consumer.py"]
    restart: unless-stopped

  tools:
    <<: *airflow-common
    profiles: ["tools"]
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./jobs:/opt/airflow/jobs:ro
      - ./scripts:/opt/airflow/scripts:ro
      - ./data:/opt/airflow/data:ro
      - airflow-logs:/opt/airflow/logs
      - ./results:/opt/airflow/results
    command: ["sleep", "infinity"]

volumes:
  postgres-data:
  rustfs-data:
  rustfs-logs:
  airflow-logs:
  kafka-data:
  clickhouse-data:
  clickhouse-logs:
